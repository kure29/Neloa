[package]
name = "neloa-relay"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Online-only blind relay for Neloa encrypted sessions"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.31"
neloa-relay-protocol = { path = "../crates/neloa-relay-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = "1.18"

[dev-dependencies]
tokio-tungstenite = "0.30"
