<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neloa Desktop</title>
  <style>
    :root {
      --bg: #0f172a;
      --window-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --surface: #f8fafc;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "PingFang SC", sans-serif;
      user-select: none;
    }

    body {
      background: #e2e8f0;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 桌面端独立主窗口 */
    .desktop-window {
      width: 980px;
      height: 680px;
      background: var(--window-bg);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 60px -15px rgba(15, 23, 42, 0.2), 0 0 0 1px rgba(0, 0, 0, 0.06);
    }

    /* ================= 极致精炼的桌面顶栏 ================= */
    header {
      height: 52px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 30;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .window-dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }
    .dot-close { background: #ff5f56; }
    .dot-min { background: #ffbd2e; }
    .dot-max { background: #27c93f; }

    .brand-name {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    /* 中部悬浮导航胶囊 */
    .nav-pill-box {
      display: flex;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 10px;
      gap: 2px;
    }

    .nav-pill-btn {
      padding: 5px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-pill-btn:hover { color: var(--text); }
    .nav-pill-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }

    /* 右侧状态与刷新 */
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .device-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-sub);
      background: var(--surface);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .online-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 8px;
      transition: all 0.15s;
    }
    .icon-btn:hover { background: #f1f5f9; color: var(--text); }

    /* ================= 视图区域 ================= */
    main {
      flex: 1;
      position: relative;
      background: #fafbfc;
      overflow-y: auto;
    }

    .view-panel {
      display: none;
      height: 100%;
      flex-direction: column;
    }
    .view-panel.active { display: flex; }

    /* 雷达画布 */
    .radar-stage {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .radar-circle {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(37, 99, 235, 0.12);
      pointer-events: none;
    }

    .pulse-glow {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.14) 0%, rgba(37, 99, 235, 0) 70%);
      animation: pulse 3s infinite ease-out;
      pointer-events: none;
    }

    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.8; }
      100% { transform: scale(2.8); opacity: 0; }
    }

    @keyframes floatNode {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* 中心设备 */
    .center-machine {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .center-card {
      width: 62px;
      height: 62px;
      border-radius: 20px;
      background: #fff;
      border: 2px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }

    /* 对端设备节点 */
    .peer-card {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      animation: floatNode 4s ease-in-out infinite;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .peer-card:hover { transform: scale(1.08) !important; }
    .peer-icon-box {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: #fff;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    .peer-card.selected .peer-icon-box {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
    }

    .peer-dot {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #10b981;
      border: 2px solid #fff;
    }

    .peer-label {
      margin-top: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      color: #334155;
    }

    /* 底部操作坞 (文件 + 拖拽高亮) */
    .dock-container {
      margin: 10px 24px 18px 24px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      z-index: 10;
    }

    .drop-trigger-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .drop-trigger-box.dragover {
      background: #eff6ff;
      border-color: var(--primary);
    }

    .drop-text {
      font-size: 0.82rem;
      color: #334155;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-action {
      padding: 8px 16px;
      border-radius: 11px;
      font-size: 0.82rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn-send {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }
    .btn-send:hover { background: var(--primary-hover); }

    .btn-text-mode {
      background: #fff;
      border: 1px solid var(--border);
      color: #334155;
    }
    .btn-text-mode:hover { background: #f1f5f9; }

    /* ================= 记录与设置页 ================= */
    .page-content {
      padding: 28px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .history-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }

    .setting-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid #f8fafc;
    }
    .setting-item:last-child { border-bottom: none; }

    /* Switch */
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0; background: #cbd5e1;
      border-radius: 22px; transition: 0.2s;
    }
    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%; transition: 0.2s;
    }
    input:checked + .slider { background: var(--primary); }
    input:checked + .slider:before { transform: translateX(18px); }

    /* 模态框与轻提示 */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-box {
      width: 360px;
      background: #fff;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.12);
    }

    .progress-track {
      width: 100%;
      height: 7px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
      margin: 14px 0 8px 0;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.08s linear;
    }

    .toast {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.78rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
      z-index: 200;
    }
    .toast.show { opacity: 1; transform: translate(-50%, -4px); }
  </style>
</head>
<body>

  <div class="desktop-window" id="windowContainer">
    <!-- 极简桌面顶栏 -->
    <header>
      <div class="header-left">
        <div class="window-dots">
          <span class="dot dot-close"></span>
          <span class="dot dot-min"></span>
          <span class="dot dot-max"></span>
        </div>
        <span class="brand-name">Neloa</span>
      </div>

      <nav class="nav-pill-box">
        <button class="nav-pill-btn active" onclick="tab('radar')">雷达直传</button>
        <button class="nav-pill-btn" onclick="tab('history')">传输记录</button>
        <button class="nav-pill-btn" onclick="tab('settings')">偏好设置</button>
      </nav>

      <div class="header-right">
        <div class="device-badge" onclick="renameLocalDevice()" title="点击重命名本机">
          <span class="online-indicator"></span>
          <span id="localDevName">Studio-PC</span>
        </div>
        <button class="icon-btn" onclick="rescanPeers()" title="刷新局域网节点">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
        </button>
      </div>
    </header>

    <main>
      <!-- 1. 雷达主界面 -->
      <div class="view-panel active" id="view-radar">
        <div class="radar-stage">
          <div class="radar-circle" style="width:180px;height:180px;"></div>
          <div class="radar-circle" style="width:330px;height:330px;"></div>
          <div class="radar-circle" style="width:490px;height:490px;"></div>
          <div class="pulse-glow"></div>

          <div class="center-machine">
            <div class="center-card">💻</div>
            <span style="margin-top:6px;font-size:0.75rem;font-weight:600;" id="centerDevLabel">Studio-PC</span>
            <span style="font-size:0.68rem;color:var(--text-sub);">本机</span>
          </div>

          <div id="dynamicNodesBox" style="position:absolute;inset:0;pointer-events:none;"></div>
        </div>

        <!-- 底部拖拽与选择坞 -->
        <div class="dock-container">
          <input type="file" id="desktopFileInput" style="display:none" onchange="onFileChosen(this)" />

          <div class="drop-trigger-box" id="dropArea" onclick="document.getElementById('desktopFileInput').click()">
            <svg width="16" height="16" fill="none" stroke="#2563eb" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            <div class="drop-text" id="fileStatusText">将文件拖入此处，或点击浏览本地文件...</div>
          </div>

          <button class="btn-action btn-text-mode" onclick="openTextDialog()">发文本</button>
          <button class="btn-action btn-send" id="btnSend" onclick="startDesktopTransfer()">发送</button>
        </div>
      </div>

      <!-- 2. 传输记录 -->
      <div class="view-panel" id="view-history">
        <div class="page-content">
          <div class="section-header">
            <span class="section-title">传输历史与队列</span>
            <button class="icon-btn" style="font-size:0.8rem;padding:4px 10px;" onclick="clearHistoryRecords()">清空记录</button>
          </div>
          <div id="recordsBox"></div>
        </div>
      </div>

      <!-- 3. 设置 -->
      <div class="view-panel" id="view-settings">
        <div class="page-content">
          <span class="section-title" style="display:block;margin-bottom:16px;">通用设置</span>
          <div class="setting-card">
            <div class="setting-item">
              <div>
                <div style="font-weight:600;font-size:0.86rem;">设备名称</div>
                <div style="font-size:0.74rem;color:var(--text-sub);margin-top:2px;">局域网内广播显示的名称</div>
              </div>
              <span style="font-size:0.82rem;color:var(--text-sub);cursor:pointer;" onclick="renameLocalDevice()">Studio-PC ›</span>
            </div>
            <div class="setting-item">
              <div>
                <div style="font-weight:600;font-size:0.86rem;">局域网自动发现</div>
                <div style="font-size:0.74rem;color:var(--text-sub);margin-top:2px;">保持可被附近设备扫描识别</div>
              </div>
              <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
            </div>
            <div class="setting-item">
              <div>
                <div style="font-weight:600;font-size:0.86rem;">默认保存路径</div>
                <div style="font-size:0.74rem;color:var(--text-sub);margin-top:2px;" id="savePath">~/Downloads/Neloa</div>
              </div>
              <button class="btn-action btn-text-mode" style="padding:4px 10px;font-size:0.75rem;" onclick="changeSaveLocation()">更改</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 文本快传弹窗 -->
    <div class="modal-backdrop" id="textDialog">
      <div class="modal-box">
        <div style="font-weight:700;font-size:0.95rem;display:flex;justify-content:space-between;">
          <span>发送文本到设备</span>
          <span style="cursor:pointer;color:var(--text-sub);" onclick="closeTextDialog()">✕</span>
        </div>
        <textarea id="textPayload" style="width:100%;height:90px;margin:12px 0;padding:10px;border:1px solid var(--border);border-radius:10px;font-size:0.82rem;outline:none;" placeholder="粘贴链接、文字或代码片段..."></textarea>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button class="btn-action btn-text-mode" onclick="closeTextDialog()">取消</button>
          <button class="btn-action btn-send" onclick="sendTextPayload()">发送</button>
        </div>
      </div>
    </div>

    <!-- 传输进度模拟 -->
    <div class="modal-backdrop" id="progressModal">
      <div class="modal-box" style="text-align:center;">
        <div style="font-weight:700;font-size:0.92rem;" id="progressTitle">正在传输文件...</div>
        <div class="progress-track"><div class="progress-fill" id="fill"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:0.72rem;color:var(--text-sub);">
          <span id="ratePct">0%</span>
          <span>52.4 MB/s</span>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    let peerList = [
      { id: 1, name: 'MacBook Pro M3', icon: '💻' },
      { id: 2, name: 'Pixel 8 Pro', icon: '📱' },
      { id: 3, name: 'Ubuntu Node', icon: '🐧' },
      { id: 4, name: 'iPad Air', icon: '📟' }
    ];

    let currentTarget = peerList[0];
    let queuedFile = null;
    let transferLogs = [
      { id: 1, name: 'Architecture_Plan_2026.key', size: '24.5 MB', peer: 'MacBook Pro M3', time: '5分钟前' },
      { id: 2, name: 'Build_Archive.tar.gz', size: '180.2 MB', peer: 'Ubuntu Node', time: '1小时前' }
    ];

    function drawPeers() {
      const box = document.getElementById('dynamicNodesBox');
      box.innerHTML = '';
      const radius = 170; // 桌面宽屏半径

      peerList.forEach((peer, i) => {
        const angle = (i / peerList.length) * 2 * Math.PI - (Math.PI / 2);
        const x = Math.round(radius * Math.cos(angle));
        const y = Math.round(radius * Math.sin(angle));
        const isSelected = currentTarget && currentTarget.id === peer.id;

        const el = document.createElement('div');
        el.className = `peer-card ${isSelected ? 'selected' : ''}`;
        el.style.pointerEvents = 'auto';
        el.style.left = `calc(50% + ${x}px - 28px)`;
        el.style.top = `calc(50% + ${y}px - 28px)`;
        el.style.animationDelay = `${i * 0.4}s`;

        el.innerHTML = `
          <div class="peer-icon-box">${peer.icon}<div class="peer-dot"></div></div>
          <span class="peer-label">${peer.name}</span>
        `;
        el.onclick = () => {
          currentTarget = peer;
          drawPeers();
          refreshSendBtn();
        };
        box.appendChild(el);
      });
      refreshSendBtn();
    }

    function refreshSendBtn() {
      document.getElementById('btnSend').innerText = `发送至 ${currentTarget ? currentTarget.name.split(' ')[0] : '目标'}`;
    }

    function tab(name) {
      document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');

      document.querySelectorAll('.nav-pill-btn').forEach((b, i) => {
        b.classList.toggle('active', ['radar', 'history', 'settings'][i] === name);
      });

      if (name === 'history') renderHistoryUI();
    }

    function rescanPeers() {
      showToast('正在重新探测局域网节点...');
      peerList = [
        { id: 1, name: 'MacBook Pro M3', icon: '💻' },
        { id: 2, name: 'Pixel 8 Pro', icon: '📱' },
        { id: 3, name: 'Ubuntu Node', icon: '🐧' },
        { id: 4, name: 'iPad Air', icon: '📟' },
        { id: 5, name: 'Windows Studio', icon: '💻' }
      ];
      drawPeers();
    }

    function onFileChosen(input) {
      if (input.files && input.files[0]) {
        queuedFile = input.files[0];
        document.getElementById('fileStatusText').innerHTML = `<b>${queuedFile.name}</b> (${(queuedFile.size/1024/1024).toFixed(1)} MB)`;
        showToast('文件已就绪');
      }
    }

    function startDesktopTransfer() {
      const fileName = queuedFile ? queuedFile.name : 'Sample_Project.pdf';
      const modal = document.getElementById('progressModal');
      const fill = document.getElementById('fill');
      const pct = document.getElementById('ratePct');

      document.getElementById('progressTitle').innerText = `正在发送至 ${currentTarget.name}`;
      modal.style.display = 'flex';
      fill.style.width = '0%';

      let current = 0;
      const timer = setInterval(() => {
        current += 5;
        fill.style.width = current + '%';
        pct.innerText = current + '%';
        if (current >= 100) {
          clearInterval(timer);
          setTimeout(() => {
            modal.style.display = 'none';
            showToast('传输已完成！');
            transferLogs.unshift({
              id: Date.now(),
              name: fileName,
              size: queuedFile ? (queuedFile.size/1024/1024).toFixed(1) + ' MB' : '15.8 MB',
              peer: currentTarget.name,
              time: '刚刚'
            });
            queuedFile = null;
            document.getElementById('fileStatusText').innerText = '将文件拖入此处，或点击浏览本地文件...';
          }, 200);
        }
      }, 35);
    }

    function renderHistoryUI() {
      const box = document.getElementById('recordsBox');
      if (transferLogs.length === 0) {
        box.innerHTML = '<div style="text-align:center;color:var(--text-sub);padding:50px 0;font-size:0.85rem;">暂无传输历史</div>';
        return;
      }
      box.innerHTML = transferLogs.map(item => `
        <div class="history-card">
          <div>
            <div style="font-weight:600;font-size:0.86rem;">${item.name}</div>
            <div style="font-size:0.74rem;color:var(--text-sub);margin-top:2px;">${item.peer} · ${item.size} · ${item.time}</div>
          </div>
          <button class="btn-action btn-text-mode" style="padding:4px 10px;font-size:0.75rem;" onclick="showToast('已在访达/资源管理器中定位')">定位</button>
        </div>
      `).join('');
    }

    function clearHistoryRecords() {
      transferLogs = [];
      renderHistoryUI();
      showToast('历史记录已清除');
    }

    function openTextDialog() { document.getElementById('textDialog').style.display = 'flex'; }
    function closeTextDialog() { document.getElementById('textDialog').style.display = 'none'; }

    function sendTextPayload() {
      const text = document.getElementById('textPayload').value;
      if (!text) return showToast('请输入文本内容');
      showToast(`文本已送达 ${currentTarget.name}`);
      transferLogs.unshift({ id: Date.now(), name: text.slice(0, 20) + '...', size: '纯文本', peer: currentTarget.name, time: '刚刚' });
      closeTextDialog();
      document.getElementById('textPayload').value = '';
    }

    function renameLocalDevice() {
      const name = prompt('输入新的本机广播名称：', 'Studio-PC');
      if (name) {
        document.getElementById('localDevName').innerText = name;
        document.getElementById('centerDevLabel').innerText = name;
        showToast('设备名已更新');
      }
    }

    function changeSaveLocation() {
      const p = prompt('设置新的默认保存目录：', '~/Downloads/Neloa');
      if (p) {
        document.getElementById('savePath').innerText = p;
        showToast('保存路径已修改');
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.innerText = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1800);
    }

    // 原生拖拽进窗口逻辑
    const dropArea = document.getElementById('dropArea');
    window.addEventListener('dragover', e => {
      e.preventDefault();
      dropArea.classList.add('dragover');
    });
    window.addEventListener('dragleave', e => {
      if (e.clientX === 0 || e.clientY === 0) dropArea.classList.remove('dragover');
    });
    window.addEventListener('drop', e => {
      e.preventDefault();
      dropArea.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        queuedFile = e.dataTransfer.files[0];
        document.getElementById('fileStatusText').innerHTML = `<b>${queuedFile.name}</b> (${(queuedFile.size/1024/1024).toFixed(1)} MB)`;
        showToast('已载入拖入的文件');
      }
    });

    drawPeers();
  </script>
</body>
</html>
