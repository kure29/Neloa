<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The launcher tints this layer, so the three regions differ only in opacity. -->
  <!-- Adaptive icons crop to a central circle, so the mark is scaled into the safe zone. -->
  <g transform="translate(256 256) scale(.7) translate(-256 -256)">
    <circle cx="196" cy="256" r="112" fill="#FFFFFF" fill-opacity=".72"/>
    <circle cx="316" cy="256" r="112" fill="#FFFFFF" fill-opacity=".4"/>
    <path d="M256 161.4A112 112 0 0 1 256 350.6A112 112 0 0 1 256 161.4z" fill="#FFFFFF"/>
  </g>
</svg>
