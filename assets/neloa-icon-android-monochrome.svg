<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The launcher tints this layer, so the halo around the signal is cut out
       with a mask instead of painted in the tile colour. -->
  <mask id="signal-halo">
    <rect width="512" height="512" fill="#FFFFFF"/>
    <circle cx="372" cy="140" r="38" fill="#000000"/>
  </mask>
  <g mask="url(#signal-halo)">
    <circle cx="256" cy="256" r="152" fill="none" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="14"/>
    <circle cx="256" cy="256" r="94" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="14"/>
    <path d="M174 340V172l164 168V172" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="372" cy="140" r="30" fill="#FFFFFF"/>
</svg>
