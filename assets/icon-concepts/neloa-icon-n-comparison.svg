  <rect width="1600" height="720" fill="#FBFAF8"/>
  <text x="80" y="54" fill="#1A1714" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="600">N 字形方案</text>

