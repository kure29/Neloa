name: Build Installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag used for the generated installers
        required: true
        default: v0.1.13
  push:
    tags:
      - v*

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    steps:
      - name: Ensure draft prerelease exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Neloa $RELEASE_TAG" \
              --notes "Neloa $RELEASE_TAG release packages. macOS uses ad-hoc signing; Windows is unsigned; Android APKs use the project release key. The unsigned iOS IPA is uploaded separately after a local Xcode build." \
              --draft \
              --prerelease
          fi

  desktop:
    name: ${{ matrix.name }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis
            rust_targets: ""
            cache_key: windows-x64
          - name: macOS Universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            cache_key: macos-universal

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: ${{ matrix.cache_key }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure macOS ad-hoc signing
        if: runner.os == 'macOS'
        shell: bash
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Build desktop installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Neloa ${{ env.RELEASE_TAG }}
          releaseBody: "Neloa release packages for macOS, Windows, Android, and iOS. See the final release notes for downloads, signing status, and checksums."
          releaseDraft: true
          prerelease: true

  android:
    name: ${{ matrix.name }}
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android ARM64 release APK
            tauri_target: aarch64
            rust_target: aarch64-linux-android
            cache_key: android-aarch64
    env:
      NDK_VERSION: 28.2.13676358

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            src-tauri/gen/android/**/*.gradle*
            src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: ${{ matrix.cache_key }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Android release signing
        id: android-signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PASSWORD repository secret. Run scripts/setup-android-signing.sh first."
            exit 1
          fi
          signing_dir="$RUNNER_TEMP/neloa-android-signing"
          mkdir -p "$signing_dir"
          keystore_path="$signing_dir/neloa-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_KEYSTORE_PATH: ${{ steps.android-signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        with:
          mobile: android
          args: --target ${{ matrix.tauri_target }} --split-per-abi --apk --ci
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Neloa ${{ env.RELEASE_TAG }}
          releaseBody: "Neloa release packages for macOS, Windows, Android, and iOS. See the final release notes for downloads, signing status, and checksums."
          releaseDraft: true
          prerelease: true
