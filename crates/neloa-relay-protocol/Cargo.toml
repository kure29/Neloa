[package]
name = "neloa-relay-protocol"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Wire protocol shared by Neloa relay clients and servers"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1.0"
